<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>测试码管理 · 天性光谱</title>
<style>
:root{--bg:#EEF1F0;--surface:#FBFCFB;--sunk:#E3E8E6;--ink:#16201E;--ink-2:#4A5753;--ink-3:#6B7773;--line:#D3DAD7;--accent:#0E5E57;--accent-soft:#D8EAE6;--bad:#B42318;
  --f:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:28px 64px;display:grid;gap:18px}
h1{margin:0;font-size:24px}
h2{margin:0 0 10px;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:var(--sunk);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3)}
.msg{font-size:14px;color:var(--ink-2);margin:8px 0 0}
.msg:empty{display:none}
.msg.err{color:var(--bad)}
.note{font-size:13px;color:var(--ink-3)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}
.big{font-size:16px;padding:12px 22px}
.picked{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;white-space:pre-line;word-break:break-all}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:var(--sunk);color:var(--ink-2);font-weight:600;padding:6px 12px;font-size:13.5px}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.list{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:520px;overflow-y:auto}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);background:#fff}
.it:first-child{border-top:0}
.it .c{font-family:var(--mono);font-size:15px;font-weight:700}
.it .t{grid-column:1;font-size:12.5px;color:var(--ink-3)}
.it .a{grid-column:2;grid-row:1/span 2;display:flex;gap:6px;align-items:center}
.it.used{background:var(--sunk)}
.it.used .c{color:var(--ink-3);text-decoration:line-through}
.badge{display:inline-block;font-family:var(--f);font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:2px;text-decoration:none}
.b-available{background:var(--accent-soft);color:var(--accent)}
.b-issued{background:#FCEFD3;color:#8A5300}
.b-active{background:#16201E;color:#fff}
.b-expired{background:#D3DAD7;color:#4A5753}
.mini{font-size:13px;padding:6px 12px}
.empty{padding:18px;text-align:center;color:var(--ink-3);font-size:14px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <h1>测试码管理</h1>

  <section class="card" id="loginCard">
    <h2>输入管理密钥</h2>
    <form class="row" id="loginForm">
      <label for="key" class="note" style="width:100%">管理密钥只保存在当前浏览器标签页里，关掉标签页就需要重新输入。</label>
      <input id="key" type="password" autocomplete="off" style="flex:1 1 260px" placeholder="KK-…">
      <button type="submit">进入</button>
    </form>
    <p class="msg" id="loginMsg"></p>
  </section>

  <div id="app" hidden style="display:grid;gap:18px">
    <section class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">用量</h2><button class="sec" id="refresh" type="button">刷新</button></div>
      <div class="stats" style="margin-top:12px">
        <div class="stat"><b id="sTotal">–</b><span>全部</span></div>
        <div class="stat"><b id="sAvail">–</b><span>未发放（可以卖）</span></div>
        <div class="stat"><b id="sIssued">–</b><span>已发放·买家还没用</span></div>
        <div class="stat"><b id="sUsed">–</b><span>已使用（含过期 <i id="sExpired" style="font-style:normal">–</i>）</span></div>
      </div>
    </section>

    <section class="card">
      <h2>发码给买家</h2>
      <form class="row" id="nextForm">
        <label for="nextN">数量</label><input id="nextN" type="number" min="1" max="500" value="1" style="width:90px">
        <button type="submit" class="big" id="nextBtn">取码并复制</button>
      </form>
      <p class="note" style="margin:8px 0 0">每次取出的都是从没发过的码，取出后自动标记为“已发放”，不会再被取到，不用担心重复。</p>
      <div id="nextOut" hidden style="display:grid;gap:8px;margin-top:12px">
        <div class="picked" id="nextCodes"></div>
        <div class="row"><button type="button" class="sec mini" id="nextCopy">再复制一次</button><button type="button" class="sec mini" id="nextUndo">取错了，放回去</button></div>
      </div>
      <p class="msg" id="nextMsg"></p>
    </section>

    <section class="card">
      <h2>全部测试码</h2>
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div class="tabs" id="tabs">
          <button type="button" class="tab" data-s="all" aria-pressed="true">全部</button>
          <button type="button" class="tab" data-s="available" aria-pressed="false">未发放</button>
          <button type="button" class="tab" data-s="issued" aria-pressed="false">已发放·未用</button>
          <button type="button" class="tab" data-s="used" aria-pressed="false">已使用</button>
        </div>
        <input id="search" class="mono" placeholder="搜索测试码" style="flex:0 1 180px;padding:6px 10px">
      </div>
      <div class="list" id="list"><div class="empty">加载中…</div></div>
      <p class="msg" id="listMsg"></p>
    </section>

    <section class="card">
      <h2>生成新测试码</h2>
      <form class="row" id="genForm">
        <label for="genN">数量</label><input id="genN" type="number" min="1" max="5000" value="100" style="width:110px">
        <label for="genBatch">批次备注</label><input id="genBatch" placeholder="例如 10月第一批" style="flex:1 1 160px">
        <button type="submit" id="genBtn">生成</button>
      </form>
      <p class="msg" id="genMsg"></p>
    </section>

    <section class="card">
      <h2>导出</h2>
      <div class="row">
        <label for="expSel">状态</label>
        <select id="expSel"><option value="all">全部</option><option value="available">未发放</option><option value="issued">已发放·未用</option><option value="used">已使用</option></select>
        <button type="button" id="expBtn">下载 CSV</button>
      </div>
      <p class="msg" id="expMsg"></p>
    </section>

    <section class="card">
      <h2>查询 / 换设备</h2>
      <form class="row" id="lookForm">
        <label for="lookCode" class="note" style="width:100%">买家换手机打不开时，查到这个码后点“允许换设备”。7 天有效期不会重置。</label>
        <input id="lookCode" class="mono" placeholder="TX-XXXX-XXXX" style="flex:1 1 200px">
        <button type="submit">查询</button>
      </form>
      <p class="msg" id="lookMsg"></p>
      <div class="row" id="lookAct" hidden><button type="button" class="sec" id="resetBtn">允许换设备</button></div>
    </section>

    <section class="card">
      <h2>导入已有测试码</h2>
      <form id="impForm" style="display:grid;gap:8px">
        <label for="impCodes" class="note">把测试码粘贴进来，一行一个。格式不对或已存在的会自动跳过。</label>
        <textarea id="impCodes" placeholder="TX-6P9P-YAMA"></textarea>
        <div class="row"><button type="submit">导入</button></div>
      </form>
      <p class="msg" id="impMsg"></p>
    </section>
  </div>

  <p class="note">© KKMEFLICKER · 天性光谱</p>
</div>
<script>
const $=id=>document.getElementById(id);
let KEY='';
try{KEY=sessionStorage.getItem('tx-admin')||''}catch(e){}
function setMsg(id,text,err){const m=$(id);m.textContent=text;m.className='msg'+(err?' err':'')}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'x-admin-key':KEY,'content-type':'application/json',...(opts.headers||{})}});
  if(r.status===401)throw new Error('auth');
  if(!r.ok)throw new Error('http');
  return r;
}
function saveBlob(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function loadStats(){
  const s=await (await api('/api/admin/stats')).json();
  $('sTotal').textContent=s.total;$('sAvail').textContent=s.available;$('sIssued').textContent=s.issued;$('sUsed').textContent=s.active+s.expired;$('sExpired').textContent=s.expired;
}
async function enter(){
  try{await loadStats();loadList();$('loginCard').hidden=true;$('app').hidden=false;try{sessionStorage.setItem('tx-admin',KEY)}catch(e){}}
  catch(e){setMsg('loginMsg',e.message==='auth'?'密钥不正确。':'连接失败，请稍后再试。',true);KEY=''}
}
$('loginForm').onsubmit=e=>{e.preventDefault();KEY=$('key').value.trim();if(KEY)enter()};
$('refresh').onclick=refreshAll;
function refreshAll(){loadStats().catch(()=>{});loadList()}
async function copyText(v){try{await navigator.clipboard.writeText(v);return true}catch(e){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}t.remove();return ok}}
const fmt=t=>t?new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const LABEL={available:'未发放',issued:'已发放·未用',active:'已使用',expired:'已使用·已过期'};
let ALL=[],FILTER='all';
async function loadList(){
  try{ALL=(await (await api('/api/admin/list?status=all')).json()).codes;drawList()}
  catch(e){$('list').innerHTML='<div class="empty">列表加载失败，点右上角“刷新”再试。</div>'}
}
function drawList(){
  const q=$('search').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  let rows=ALL.filter(r=>FILTER==='all'||(FILTER==='used'?(r.status==='active'||r.status==='expired'):r.status===FILTER));
  if(q)rows=rows.filter(r=>r.code.replace(/-/g,'').includes(q));
  const order={available:0,issued:1,active:2,expired:3};
  if(FILTER==='all')rows=rows.slice().sort((a,b)=>order[a.status]-order[b.status]);
  const shown=rows.slice(0,400);
  if(!shown.length){$('list').innerHTML='<div class="empty">没有符合的测试码。</div>';return}
  $('list').innerHTML=shown.map(r=>{
    const used=r.status==='active'||r.status==='expired';
    const t=r.status==='available'?`批次 ${r.batch||'—'}`:r.status==='issued'?`发放于 ${fmt(r.issued)}`:`首次使用 ${fmt(r.first_used)} · ${r.status==='expired'?'已过期':'到期 '+fmt(r.expires)}`;
    const act=r.status==='available'?`<button type="button" class="mini" data-act="take" data-c="${r.code}">复制</button>`:r.status==='issued'?`<button type="button" class="sec mini" data-act="copy" data-c="${r.code}">复制</button><button type="button" class="sec mini" data-act="back" data-c="${r.code}">放回</button>`:'';
    return `<div class="it${used?' used':''}"><div><span class="c">${r.code}</span><span class="badge b-${r.status}">${LABEL[r.status]}</span></div><div class="t">${t}</div><div class="a">${act}</div></div>`;
  }).join('')+(rows.length>shown.length?`<div class="empty">只显示前 400 个，用搜索或导出查看其余的。</div>`:'');
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;FILTER=b.dataset.s;for(const x of $('tabs').children)x.setAttribute('aria-pressed',x===b?'true':'false');drawList()};
$('search').oninput=drawList;
$('list').onclick=async e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const c=b.dataset.c;
  try{
    if(b.dataset.act==='take'){await api('/api/admin/issued',{method:'POST',body:JSON.stringify({code:c,on:true})});const ok=await copyText(c);setMsg('listMsg',ok?`${c} 已复制，并标记为已发放。`:`${c} 已标记为已发放，请手动复制。`)}
    else if(b.dataset.act==='copy'){const ok=await copyText(c);setMsg('listMsg',ok?`${c} 已复制（这个码之前已经发过）。`:'请手动复制。')}
    else{await api('/api/admin/issued',{method:'POST',body:JSON.stringify({code:c,on:false})});setMsg('listMsg',`${c} 已放回“未发放”。`)}
    refreshAll();
  }catch(err){setMsg('listMsg','操作失败，请稍后再试。',true)}
};
let lastPicked=[];
$('nextForm').onsubmit=async e=>{
  e.preventDefault();const btn=$('nextBtn');btn.disabled=true;
  try{
    const n=Math.max(1,+$('nextN').value||1);
    const d=await (await api('/api/admin/next',{method:'POST',body:JSON.stringify({n})})).json();
    lastPicked=d.codes;
    if(!d.codes.length){$('nextOut').hidden=true;setMsg('nextMsg','没有未发放的测试码了，请先在下面生成一批。',true)}
    else{
      $('nextCodes').textContent=d.codes.join('\n');$('nextOut').hidden=false;
      const ok=await copyText(d.codes.join('\n'));
      setMsg('nextMsg',(ok?'已复制':'请手动复制上面的码')+`，${d.codes.length} 个码已标记为已发放。`+(d.codes.length<n?`（只剩这 ${d.codes.length} 个可发）`:''));
    }
    refreshAll();
  }catch(err){setMsg('nextMsg','取码失败，请稍后再试。',true)}
  btn.disabled=false;
};
$('nextCopy').onclick=async()=>{const ok=await copyText(lastPicked.join('\n'));setMsg('nextMsg',ok?'已再复制一次。':'请手动复制。')};
$('nextUndo').onclick=async()=>{
  try{for(const c of lastPicked)await api('/api/admin/issued',{method:'POST',body:JSON.stringify({code:c,on:false})});setMsg('nextMsg',`已放回 ${lastPicked.length} 个码，它们会重新出现在“未发放”里。`);lastPicked=[];$('nextOut').hidden=true;refreshAll()}
  catch(e){setMsg('nextMsg','操作失败，请稍后再试。',true)}
};
$('genForm').onsubmit=async e=>{
  e.preventDefault();const btn=$('genBtn');btn.disabled=true;setMsg('genMsg','生成中…');
  try{
    const n=+$('genN').value||100,batch=$('genBatch').value.trim();
    const d=await (await api('/api/admin/generate',{method:'POST',body:JSON.stringify({n,batch})})).json();
    setMsg('genMsg',`已生成 ${d.codes.length} 个测试码，都在“未发放”里。卖的时候用上面的“取码并复制”。`);refreshAll();
  }catch(err){setMsg('genMsg','生成失败，请稍后再试。',true)}
  btn.disabled=false;
};
$('expBtn').onclick=async()=>{
  const st=$('expSel').value;setMsg('expMsg','导出中…');
  try{const t=await (await api('/api/admin/export?status='+st)).text();saveBlob(t,`测试码_${st}.csv`);setMsg('expMsg','已下载。')}
  catch(e){setMsg('expMsg','导出失败，请稍后再试。',true)}
};
let looked=null;
$('lookForm').onsubmit=async e=>{
  e.preventDefault();$('lookAct').hidden=true;looked=null;
  try{
    const d=await (await api('/api/admin/lookup?code='+encodeURIComponent($('lookCode').value))).json();
    if(!d.code){setMsg('lookMsg','找不到这个测试码。',true);return}
    const c=d.code,f=t=>new Date(t).toLocaleString('zh-CN');
    looked=c.code;
    if(!c.first_used)setMsg('lookMsg',`${c.code}：买家还没用${c.issued?`（已于 ${f(c.issued)} 发放）`:'（未发放）'}，批次：${c.batch||'—'}`);
    else{
      const exp=Date.now()>c.expires;
      setMsg('lookMsg',`${c.code}：首次使用 ${f(c.first_used)}，${exp?'已于':'有效期至'} ${f(c.expires)}${exp?' 过期':''}；${c.device?'已绑定一台设备':'未绑定设备'}`);
      if(c.device&&!exp)$('lookAct').hidden=false;
    }
  }catch(err){setMsg('lookMsg','查询失败，请稍后再试。',true)}
};
$('resetBtn').onclick=async()=>{
  if(!looked)return;
  try{await api('/api/admin/reset',{method:'POST',body:JSON.stringify({code:looked})});setMsg('lookMsg',`${looked} 已解除设备绑定，买家可以在新设备上重新输入。`);$('lookAct').hidden=true}
  catch(e){setMsg('lookMsg','操作失败，请稍后再试。',true)}
};
$('impForm').onsubmit=async e=>{
  e.preventDefault();
  const codes=$('impCodes').value.split(/[\s,;]+/).filter(Boolean);
  if(!codes.length)return;
  try{const d=await (await api('/api/admin/import',{method:'POST',body:JSON.stringify({codes})})).json();setMsg('impMsg',`导入了 ${d.added} 个新测试码。`);$('impCodes').value='';refreshAll()}
  catch(err){setMsg('impMsg','导入失败，请稍后再试。',true)}
};
if(KEY)enter();
</script>
</body>
</html>
