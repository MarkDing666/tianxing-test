<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天性光谱测试</title>
<meta name="description" content="天性光谱：45 道题的性格与职业兴趣测试，基于大五人格与霍兰德六边形。© KKMEFLICKER">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one narrow booklet column on mist paper; the Holland hexagon lives on a dark "night stage" panel where six coloured lights glow and the person's three-letter code lights up. */
:root{
  --bg:#EEF1F0; --surface:#FBFCFB; --sunk:#E3E8E6;
  --ink:#16201E; --ink-2:#4A5753; --ink-3:#7D8985; --line:#D3DAD7;
  --accent:#0E5E57; --accent-ink:#FFFFFF; --accent-soft:#D8EAE6;
  --stage:#0E1513; --stage-2:#16211E; --stage-ink:#EEF4F2; --stage-dim:#93A39E;
  --paper:#FBF7EE; --paper-ink:#1F1717; --paper-dim:#5C524A; /* the characters' ink-on-paper world stays light in both themes */
  --r:#C2532F; --i:#2B66A8; --a:#A83E78; --s:#23896A; --e:#C98317; --c:#5650B8;
  --f-display:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1413;--surface:#171E1C;--sunk:#1F2826;--ink:#E7EDEB;--ink-2:#AAB6B2;--ink-3:#7A8783;--line:#2B3633;
  --accent:#5CC2B5;--accent-ink:#0B1513;--accent-soft:#1C3532;--stage:#0A100E;--stage-2:#121B18;
  --r:#E9805F;--i:#6FA3E0;--a:#DC79B0;--s:#5CC79F;--e:#EDB252;--c:#9590F0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1413;--surface:#171E1C;--sunk:#1F2826;--ink:#E7EDEB;--ink-2:#AAB6B2;--ink-3:#7A8783;--line:#2B3633;
  --accent:#5CC2B5;--accent-ink:#0B1513;--accent-soft:#1C3532;--stage:#0A100E;--stage-2:#121B18;
  --r:#E9805F;--i:#6FA3E0;--a:#DC79B0;--s:#5CC79F;--e:#EDB252;--c:#9590F0;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:14px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:900;text-wrap:balance;margin:0;line-height:1.28;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:500}
.note{font-size:13px;color:var(--ink-3);line-height:1.65}
html[lang="en"] .eyebrow{letter-spacing:.08em;text-transform:uppercase;font-size:11.5px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.06em}
.brand svg{width:20px;height:20px}
.top-actions{display:flex;align-items:center;gap:6px}
.ghost{background:none;border:0;color:var(--ink-2);font-size:14px;padding:8px 4px}
.lang{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;color:var(--ink-3);font-family:var(--f-mono)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.stage{background:radial-gradient(120% 90% at 50% 20%,var(--stage-2),var(--stage));color:var(--stage-ink);border-radius:22px;overflow:hidden;position:relative}
.stage canvas{display:block;width:100%;max-width:100%}

/* intro */
.hero{display:grid;gap:18px;padding-block:4px 30px}
.hero .stage canvas{aspect-ratio:1/0.92}
.hero h1{font-size:clamp(30px,8.4vw,42px)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--r),var(--e),var(--s),var(--i),var(--c),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--ink-2)}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13.5px;color:var(--ink-2)}
.facts b{font-family:var(--f-mono);color:var(--ink);font-weight:600;margin-right:4px;font-size:15px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:999px;padding:14px 28px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);transition:transform .15s ease,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.32;cursor:default;transform:none}
.section{padding-block:28px;border-top:1px solid var(--line);display:grid;gap:16px}
.section > h2{font-size:23px}
.section .sub{color:var(--ink-2);font-size:14.5px;margin-top:-8px}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cast-card{background:var(--paper);border:2px solid var(--paper-ink);border-radius:14px;padding:8px 6px 10px;display:grid;justify-items:center;align-content:start;gap:2px;text-align:center;min-width:0;color:var(--paper-ink)}
.cast-card img{width:100%;max-width:118px;height:auto;aspect-ratio:220/280;display:block}
.cast-card b{font-size:13.5px;line-height:1.35}
.cast-card span{font-size:11px;color:var(--paper-dim);font-family:var(--f-mono);letter-spacing:.04em}
.scale-card{background:var(--surface);border-radius:var(--radius);padding:18px;display:grid;gap:10px;border:1px solid var(--line)}
.scale-card h3{font-size:17px}
.scale-card p{color:var(--ink-2);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.refs{display:grid;gap:12px;font-size:14px;color:var(--ink-2);margin-top:14px}
.refs div{display:grid;gap:2px}
.refs b{color:var(--ink);font-weight:500}
details summary{cursor:pointer;font-weight:700;font-size:17px;color:var(--ink);list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display)}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-3);font-size:20px}
details[open] summary::after{content:"−"}

/* quiz */
.quiz{display:grid;gap:18px}
.progress{display:grid;gap:8px}
.progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--s),var(--i),var(--c),var(--a));background-size:560px 100%;transition:width .35s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 18px 22px;display:grid;gap:20px;align-content:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.scene{font-family:var(--f-body);letter-spacing:.02em;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px;text-align:right}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,5.4vw,24px);line-height:1.55;text-wrap:pretty}
.qhint{font-size:13px;color:var(--ink-3);margin-top:-10px}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-top:4px}
.lk{display:grid;justify-items:center;align-content:start;gap:8px;background:none;border:0;padding:4px 0;min-width:0}
.lk .dwrap{height:50px;display:grid;place-items:center}
.lk .dot{border-radius:50%;border:2px solid var(--lk);display:grid;place-items:center;transition:background .15s,transform .15s}
.lk .dot::after{content:"";width:34%;height:34%;border-radius:50%;background:var(--surface);opacity:0}
.lk small{font-size:11.5px;line-height:1.3;color:var(--ink-3);text-align:center;transition:color .15s}
.lk.on .dot{background:var(--lk);transform:scale(1.06)}
.lk.on .dot::after{opacity:1}
.lk.on small{color:var(--ink);font-weight:700}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:13px 14px;font-size:15.5px;line-height:1.6;transition:border-color .15s,background .15s}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--sunk);color:var(--ink-2);margin-top:1px;transition:background .15s,color .15s}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .key{background:var(--accent);color:var(--accent-ink)}
.opt.skip{border-style:dashed;color:var(--ink-3);font-size:13px;padding-block:9px;margin-top:4px}
.opt.skip .key{background:transparent;border:1.5px dashed var(--line)}
@media (hover:hover) and (pointer:fine){.opt:not(.on):hover{border-color:var(--ink-3)}.lk:not(.on):hover .dot{background:color-mix(in srgb,var(--lk) 18%,transparent)}}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qnav .btn{flex:1;max-width:260px;padding-block:15px}
.qnav .ghost:disabled{opacity:.3}
.interlude{display:grid;gap:16px;padding:26px 22px}
.interlude h2{font-size:24px}
.interlude p{color:var(--stage-dim)}

/* result */
.rhero{display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 20px 26px}
.paper{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:22px}
.rhero .mascot{width:230px;height:auto;max-width:66%;aspect-ratio:220/280}
.rhero .who{font-size:13px;letter-spacing:.14em;color:var(--paper-dim)}
.rhero h1{font-size:clamp(32px,9vw,46px);color:var(--paper-ink)}
.rhero .tag{font-family:var(--f-display);font-weight:600;font-size:18px;color:#4A413A}
.rhero .code span{border:2px solid var(--paper-ink)}
.code{font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.1em;display:flex;gap:6px;align-items:center;justify-content:center}
.code span{min-width:30px;padding:3px 8px;border-radius:8px;color:#10201C}
.rarity{display:inline-flex;align-items:baseline;flex-wrap:wrap;justify-content:center;gap:6px;background:var(--paper-ink);border-radius:999px;padding:6px 16px;font-size:14px;color:var(--paper)}
.rarity b{font-family:var(--f-mono);font-size:18px;color:var(--paper)}
.why{font-size:13.5px;color:var(--paper-dim);max-width:34em}
.rels,.blinds{display:grid;gap:10px}
.rel{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.rel img{width:88px;height:auto;aspect-ratio:220/280;background:var(--paper);border:1.5px solid var(--paper-ink);border-radius:10px;display:block}
.rel > div{display:grid;gap:4px;min-width:0}
.rel small{font-size:12px;color:var(--ink-3)}
.rel b{font-size:16px}
.quote{font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.6}
.rtip,.fix{font-size:13.5px;color:var(--ink-2)}
.rtip span,.fix span{font-weight:700;color:var(--accent);margin-right:6px}
.blind{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:grid;gap:6px}
.blind b{font-size:15.5px}
.blind > p{font-size:14.5px;color:var(--ink-2)}
.blind .fix{background:var(--accent-soft);border-radius:10px;padding:8px 11px;color:var(--ink)}
.portrait{display:grid;gap:12px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.cell .eyebrow{font-size:11px}
.cell p{font-size:14.5px;color:var(--ink)}
.cell.wide{grid-column:1/-1}
.letters{display:grid;gap:10px}
.letter{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.letter > span{font-family:var(--f-mono);font-weight:600;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#10201C;font-size:17px}
.letter div{min-width:0}
.letter b{display:block;font-size:15px}
.letter small{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.letter p{font-size:14px;color:var(--ink-2)}
.stage.hexstage canvas{aspect-ratio:1/0.86}
.ibars{display:grid;gap:9px}
.ibar{display:grid;grid-template-columns:minmax(78px,auto) 1fr 40px;align-items:center;gap:10px;font-size:13.5px}
.ibar .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.ibar .track i{display:block;height:100%;border-radius:99px}
.ibar span:last-child{font-family:var(--f-mono);color:var(--ink-3);text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
.insight{font-size:14.5px;color:var(--ink-2);background:var(--sunk);border-radius:14px;padding:13px 15px}
.career-group{display:grid;gap:8px}
.career-group h3{font-size:15px;font-family:var(--f-body);font-weight:700;display:flex;align-items:center;gap:8px}
.career-group .code{font-size:12px;justify-content:flex-start}
.career-list{display:flex;flex-wrap:wrap;gap:6px}
.career-list span{font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.caution{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--e);padding:4px 0 4px 12px}
.traits{display:grid;gap:22px}
.trait{display:grid;gap:7px}
.trait-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.trait-head b{font-size:16.5px}
.trait-head b small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:6px}
.trait-head > span{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ttrack{position:relative;height:8px;border-radius:99px;background:var(--sunk)}
.ttrack i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.ttrack em{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink-3);left:50%;opacity:.45}
.track-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.trait p{font-size:14.5px;color:var(--ink-2)}
.tips{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.tips li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:14.5px;color:var(--ink-2)}
.tips li b{color:var(--ink);display:block;font-size:15px;margin-bottom:2px}
.share-out{display:grid;gap:10px;justify-items:center}
.share-out img{width:100%;max-width:340px;border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.22)}
.credit{text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);padding-top:28px;opacity:.8}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn,.bar span,.opt,.lk .dot{transition:none}}
@media (max-width:370px){.grid2{grid-template-columns:1fr}.cast{grid-template-columns:repeat(2,1fr)}.lk small{font-size:10.5px}}
</style>
</head>
<body>


<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20.7 7v10L12 22 3.3 17V7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="4.6" r="2" fill="var(--r)"/><circle cx="18.6" cy="8.4" r="2" fill="var(--i)"/><circle cx="18.6" cy="15.6" r="2" fill="var(--a)"/><circle cx="12" cy="19.4" r="2" fill="var(--s)"/><circle cx="5.4" cy="15.6" r="2" fill="var(--e)"/><circle cx="5.4" cy="8.4" r="2" fill="var(--c)"/></svg>
      <span id="brandName">天性光谱</span>
    </div>
    <div class="top-actions">
      <button class="ghost" id="homeBtn" hidden></button>
      <div class="lang" role="group" aria-label="Language">
        <button id="langZh" aria-pressed="true">中</button><button id="langEn" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <main id="intro"></main>
  <main id="quiz" hidden>
    <div class="quiz">
      <div class="progress">
        <div class="progress-meta"><span id="partLabel"></span><span id="countLabel"></span></div>
        <div class="bar"><span id="bar"></span></div>
      </div>
      <div id="stageQ"></div>
      <div class="qnav" id="qnav">
        <button class="ghost" id="prevBtn"></button>
        <button class="btn" id="nextBtn"></button>
      </div>
    </div>
  </main>
  <main id="result" hidden></main>
  <footer class="credit">© 2026 KKMEFLICKER</footer>
</div>

<script>
/* ================= LANGUAGE ================= */
let LANG='zh';
try{LANG=localStorage.getItem('tianxing-lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en')}catch(e){}
const t=a=>Array.isArray(a)?a[LANG==='en'?1:0]:a;
const UI={
 brand:['天性光谱','Spectrum'],
 home:['回到首页','Home'],
 eyebrow:['性格 × 职业兴趣 · 自我探索测试','Personality × career interests · self-discovery'],
 h1:['你的天性，会折射出<em>哪种颜色</em>？','What colours does <em>your nature</em> refract into?'],
 lede:['45 个贴近日常的小问题和场景，基于心理学研究中最常用的两套模型，帮你看看自己是怎样的人、天然会被什么样的事吸引，并给出可以参考的职业方向。','45 everyday questions and scenes, built on the two models psychologists use most, to show what kind of person you are, what naturally draws you in, and which career directions are worth a look.'],
 facts:[[['45','道题'],['8','分钟左右'],['2','套学术模型'],['12','位天性角色']],[['45','questions'],['8','minutes'],['2','research models'],['12','characters']]],
 start:['开始测试','Start the test'],resume:['继续上次','Continue'],seeLast:['查看上次结果','See my last result'],
 castH:['十二位天性角色','Twelve characters'],castSub:['兴趣主色决定你在哪一种颜色，外向还是内敛决定你是哪一位。每种颜色一个男孩、一个女孩。','Your main interest picks the colour; outgoing or reserved picks the character. Each colour has one boy and one girl.'],
 measH:['它测量什么','What it measures'],
 p1Eb:['第一部分 · 30 题','Part 1 · 30 questions'],p1H:['大五人格：你是怎样的人','Big Five: who you are'],
 p1P:['人格心理学里证据最充分的模型。跨越几十个国家的研究反复发现，人的性格差异大体可以归到五个维度上。这一部分的 30 题覆盖了每个维度下的 6 个细分侧面。','The best-supported model in personality psychology. Studies across dozens of countries keep finding that personality differences fall along five broad dimensions. These 30 questions cover six facets of each one.'],
 p2Eb:['第二部分 · 15 个场景','Part 2 · 15 scenes'],p2H:['霍兰德六边形：你被什么吸引','Holland hexagon: what draws you in'],

 x:{lab:['外向','Outgoing'],line:['你外向的一面让你更愿意站到前面：把想法说出来、把人拉进来，在热闹的协作里状态最好。','Your outgoing side puts you up front: you voice ideas, pull people in, and do your best work in lively collaboration.']},
 i:{lab:['内敛','Reserved'],line:['你内敛的一面让你更习惯在安静中发力：先想清楚再开口，在不被打扰的专注时间里状态最好。','Your reserved side makes you work best in quiet: you think before you speak and shine in uninterrupted focus.']}

// blind spots: [title, what it looks like, how to improve]
const BLIND_TYPE={
 R:[[['只做不说','Doing, not telling'],['你习惯埋头把事做完，却很少说明做了什么、为什么这样做，别人容易低估你的贡献。','You get the job done but rarely explain what you did or why, so people underrate your contribution.'],['每完成一件事，用三句话说清楚：做了什么、解决了什么问题、下一步是什么。','After each task, sum it up in three lines: what you did, what it solved, what comes next.']],
    [['对“看不见”的事没耐心','Impatient with the abstract'],['开会、规划、讨论方向这类看不到成果的事，你容易走神或急着跳过。','Meetings, planning and big-picture talk feel pointless, so you drift off or rush past them.'],['把讨论当成“施工图”：方向没定好，后面的活就会返工。','Treat planning as the blueprint: get it wrong and the build gets redone.']]],
 I:[[['想太久，动太晚','Thinking too long'],['你想把问题想透才行动，常常错过最好的时机。','You want to think everything through before acting, and the best moment passes.'],['给每个决定设一个截止时间，到点就用手上最好的答案先行动。','Give each decision a deadline, then act on the best answer you have.']],
    [['讲得太深','Too deep for the room'],['你说的有道理，但别人跟不上，会觉得你有距离感。','You make good points, but people can’t keep up and find you distant.'],['先说结论，再说理由；细节等别人问了再展开。','Lead with the conclusion, then the reasons; save details for when people ask.']]],
 A:[[['灵感多，收尾少','Many starts, few finishes'],['新点子一来就想开始，旧的作品常常停在半路。','A new idea arrives and you start again, leaving the last piece half done.'],['同一时间只推进一个主作品，新点子先记进灵感本。','Push one main piece at a time and park new ideas in a notebook.']],
    [['对批评很敏感','Sensitive to critique'],['作品像你的一部分，别人一句否定就会让你很受伤。','Your work feels like part of you, so one negative comment really stings.'],['把“作品”和“我”分开，问对方“哪里可以更好”，而不是“喜不喜欢”。','Separate the work from yourself; ask “what could be better?” rather than “do you like it?”']]],
 S:[[['不会说“不”','Can’t say no'],['你很难拒绝别人，最后常常把自己累垮。','You find it hard to refuse anyone and end up worn out.'],['答应之前先说“我想一下”，给自己留出判断的时间。','Before agreeing, say “let me think about it” to give yourself room to decide.']],
    [['回避冲突','Avoiding conflict'],['为了维持和气，你会把不满压在心里，直到某天一下子爆发。','To keep the peace you bottle things up until they burst out.'],['小事当下就说，用“我感觉……”开头，而不是“你总是……”。','Raise small things early, starting with “I feel…” rather than “you always…”.']]],
 E:[[['跑太快，细节掉','Speed over detail'],['你着急往前推，细节和风险常常被忽略。','You push ahead so fast that details and risks get missed.'],['重要决定前，专门找一个“爱挑刺的人”帮你过一遍。','Before big calls, ask a natural critic to pick holes in the plan.']],
    [['太想赢','Wanting to win too much'],['竞争心让你有时听不进反对意见，甚至伤到身边的人。','Your competitive streak can shut out objections and bruise the people around you.'],['讨论时先复述对方的观点，再说自己的。','In a debate, restate the other person’s view before giving yours.']]],
 C:[[['怕变化','Uneasy with change'],['计划被打乱时你会焦虑，甚至抗拒新方法。','When plans change you get anxious and may resist new ways of working.'],['在计划里预留“缓冲区”，把变化当成计划的一部分。','Build buffers into plans and treat change as part of the plan.']],
    [['抠细节，忘全局','Lost in the details'],['每个细节你都能做对，但有时把太多时间花在不重要的地方。','You get every detail right but sometimes spend too long on what doesn’t matter.'],['动手前先问自己：这件事最重要的 20% 是哪部分？','Before you start, ask: which 20% of this really matters?']]]

function ncdf(z){const q=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);const p=d*q*(.3193815+q*(-.3565638+q*(1.781478+q*(-1.821256+q*1.330274))));return z>0?1-p:p}
function score(ans){
  const acc={O:[],C:[],E:[],A:[],N:[]};
  BF.forEach((q,i)=>{const v=ans[i];if(v!=null)acc[q.k].push(q.r?6-v:v)});
  const big={};
  for(const k in acc){const a=acc[k];const m=a.length?a.reduce((x,y)=>x+y,0)/a.length:3;const [mu,sd]=NORM[k];big[k]={mean:m,pct:Math.round(Math.min(99,Math.max(1,ncdf((m-mu)/sd)*100)))}}
  // interests: share of times a type was chosen out of the scenes where it was offered and answered (skips excluded)
  const cnt={},app={};ORDER.forEach(k=>{cnt[k]=0;app[k]=0});
  SC.forEach((q,i)=>{const v=ans[N_BF+i];if(!v||v==='0')return;Object.keys(q.o).forEach(k=>app[k]++);if(cnt[v]!=null)cnt[v]++});

  const vals=ORDER.map(k=>share[k]);

}

let heroRAF=null;

function startHero(){
  stopHero();const cv=$('heroArt');if(!cv)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const {ctx,W,H}=setupCanvas(cv);
  const draw=ts=>{
    const cyc=3400,n=Math.floor(ts/cyc),ph=(ts%cyc)/cyc;const code=DEMO[n%DEMO.length];
    const prog=reduce?1:Math.min(1,ph/0.45);const fade=reduce?1:(ph>0.85?1-(ph-0.85)/0.15:1);
    ctx.clearRect(0,0,W,H);grain(ctx,W,H,5,.045);
    const R=Math.min(W,H)*0.33;
    drawConstellation(ctx,{cx:W/2,cy:H/2,R,code:[],t:ts});
    ctx.globalAlpha=fade;drawConstellation(ctx,{cx:W/2,cy:H/2,R,code,prog,t:ts,center:true});ctx.globalAlpha=1;
    if(!reduce)heroRAF=requestAnimationFrame(draw);
  };
  draw(reduce?0:performance.now());

function stopHero(){if(heroRAF)cancelAnimationFrame(heroRAF);heroRAF=null}

function renderQuiz(){

  $('qnav').hidden=false;
  const isBF=i<N_BF;
  $('partLabel').textContent=u(isBF?'part1':'part2');
  $('countLabel').textContent=`${i+1} / ${N_ALL}`;
  $('bar').style.width=`${i/N_ALL*100}%`;
  const cur=state.answers[i];
  if(isBF){
    const q=BF[i];const sizes=[44,36,30,36,44];const labels=t(UI.likert);
    $('stageQ').innerHTML=`<div class="qcard fade">
      <div class="qhead"><span>${String(i+1).padStart(2,'0')} / ${N_BF}</span><span class="scene">${t(BF_META[q.k].q)}</span></div>
      <div class="qtext">${t(q.t)}</div>
      <div class="qhint">${u('hint1')}</div>
      <div class="likert" role="radiogroup">${sizes.map((s,j)=>{const c=j<3?'var(--ink-3)':'var(--accent)';return `<button class="lk ${cur===j+1?'on':''}" style="--lk:${c}" role="radio" aria-checked="${cur===j+1}" data-v="${j+1}"><span class="dwrap"><span class="dot" style="width:${s}px;height:${s}px"></span></span><small>${labels[j]}</small></button>`}).join('')}</div>
    </div>`;
    $('stageQ').querySelectorAll('.lk').forEach(b=>b.onclick=()=>choose(+b.dataset.v));
  }else{

      <div class="qhead"><span>${u('scene')} ${String(n+1).padStart(2,'0')} / ${SC.length}</span><span class="scene">${t(q.s)}</span></div>
      <div class="qtext">${t(q.q)}</div>
      <div class="qhint">${u('hint2')}</div>
      <div class="opts" role="radiogroup">${keys.map((k,j)=>`<button class="opt ${cur===k?'on':''}" role="radio" aria-checked="${cur===k}" data-v="${k}"><span class="key">${'ABCD'[j]}</span><span>${t(q.o[k])}</span></button>`).join('')}
        <button class="opt skip ${cur==='0'?'on':''}" role="radio" aria-checked="${cur==='0'}" data-v="0"><span class="key">–</span><span>${u('skip')}</span></button></div>

  $('nextBtn').disabled=cur==null;

function renderInterlude(){
  $('qnav').hidden=true;
  $('partLabel').textContent=u('p1done');$('countLabel').textContent=`${N_BF} / ${N_ALL}`;
  $('bar').style.width=`${N_BF/N_ALL*100}%`;
  $('stageQ').innerHTML=`<div class="stage interlude fade">
    <div class="eyebrow" style="color:var(--stage-dim)">${N_BF} / ${N_ALL}</div>
    <h2>${u('interH')}</h2><p>${u('interP1')}</p><p>${u('interP2')}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="goPart2">${u('go2')}</button><button class="btn secondary" id="backPart1" style="background:rgba(255,255,255,.1);color:var(--stage-ink)">${u('back1')}</button></div>
  </div>`;
  $('goPart2').onclick=()=>{state.inter=true;save();renderQuiz()};
  $('backPart1').onclick=()=>{state.idx=N_BF-1;save();renderQuiz()};

function choose(v){
  state.answers[state.idx]=v;save();
  const sel=state.idx<N_BF?'.lk':'.opt';
  $('stageQ').querySelectorAll(sel).forEach(b=>{const on=String(b.dataset.v)===String(v);b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
  $('nextBtn').disabled=false;
}
function next(){
  if(state.answers[state.idx]==null)return;
  if(state.idx>=N_ALL-1){state.done=true;save();renderResult();show('result');return}
  state.idx++;if(state.idx===N_BF)state.inter=false;
  save();renderQuiz();window.scrollTo({top:0});
}
function prev(){
  if(state.idx===N_BF){state.inter=false;save();return renderInterlude()}
  if(state.idx>0){state.idx--;save();renderQuiz()}
}
$('nextBtn').onclick=next;$('prevBtn').onclick=prev;

function buildTips(big){
  const L=k=>level(big[k].pct),r=[];
  const add=(c,a,b)=>c&&r.push([a,b]);
  add(L('C')==='H',['发挥你的自律','Use your discipline'],['有长期目标、需要稳定投入的路径会放大你的优势，比如需要考证书、积累资历的专业岗位。','Paths with long-term goals and steady effort amplify your strengths, such as professions built on credentials and experience.']);
  add(L('C')==='L',['给自己搭外部结构','Build outside structure'],['节奏多变、项目制的工作更适合你。用截止日期、清单和搭档来弥补计划性。','Varied, project-based work suits you. Use deadlines, checklists and a partner to supply structure.']);
  add(L('E')==='H',['靠近人群','Stay close to people'],['选择对外沟通多、合作频繁的岗位。长期独自埋头的工作会让你憋闷。','Choose roles with lots of contact and collaboration. Long stretches of solo work will wear on you.']);
  add(L('E')==='L',['保护你的专注时间','Protect your focus'],['你最好的产出来自少打扰的深度工作，选择能安静做事的团队和岗位。','Your best work comes from deep, uninterrupted focus. Look for teams and roles that allow quiet work.']);
  add(L('N')==='H',['选对节奏','Choose the right pace'],['可预期的节奏和支持度高的团队能让你稳定发挥。长期高压的岗位会持续消耗你。','A predictable pace and a supportive team help you perform steadily. Constant high-pressure roles will drain you.']);
  add(L('N')==='L',['抗压是你的资本','Pressure is your edge'],['快节奏、不确定性高的工作，比如危机处理和一线业务，正是你的优势场。','Fast-moving, uncertain work such as crisis response or front-line business is where you shine.']);
  add(L('O')==='H',['留出学习的空间','Keep learning'],['你需要不断接触新东西，重复性太高的岗位会让你很快失去动力。','You need a steady flow of new things; highly repetitive roles will drain your motivation fast.']);
  add(L('O')==='L',['把成熟方法做到极致','Master proven methods'],['方法清晰的成熟行业很适合你，你能把被验证过的做法执行得很扎实。','Mature fields with clear methods suit you; you execute proven approaches with real care.']);
  add(L('A')==='H',['在协作里发光','Shine in collaboration'],['团队协作型的工作会让你如鱼得水，同时也要练习表达不同意见。','Team-based work suits you well. Keep practising voicing disagreement too.']);
  add(L('A')==='L',['直率是一种优势','Directness is a strength'],['需要谈判、评审、做艰难决定的岗位，用得上你的直接和坚持。','Roles involving negotiation, review and hard calls make good use of your directness.']);
  if(!r.length)r.push([['均衡的性格','A balanced profile'],['你的五项特质都在常见范围内，适应面很广。选方向时可以更多参考你的兴趣代码。','All five traits sit in the common range, so you adapt widely. Let your interest code guide your direction more.']]);
  return r.slice(0,4);
}
function insightText(r){
  const [a,b]=r.rank;
  if(r.spread<=0.2)return t(['你六个方向的兴趣分布比较平均，说明你适应面广，也可能还没遇到特别热爱的事。多去实习、做项目，会帮你把兴趣看得更清楚。','Your interests are spread fairly evenly. You adapt widely, and you may not have found the thing you love yet. Internships and projects will sharpen the picture.']);
  if(r.dist===1)return t([`你的前两色 ${a} 和 ${b} 在六边形上相邻。霍兰德把这叫做“一致性高”：两种兴趣彼此兼容，比较容易找到同时满足它们的工作。`,`Your top two colours, ${a} and ${b}, sit next to each other on the hexagon. Holland called this high consistency: the two interests fit together, so work that satisfies both is easier to find.`]);
  if(r.dist===2)return t([`你的前两色 ${a} 和 ${b} 在六边形上隔了一格，兴趣有一定跨度。可以找以 ${a} 为主、带一些 ${b} 元素的角色。`,`Your top two colours, ${a} and ${b}, are one step apart on the hexagon, so your interests have some range. Look for roles led by ${a} with some ${b} in them.`]);
  return t([`你的前两色 ${a} 和 ${b} 在六边形上正好相对，这种组合并不常见。它意味着你可能更适合复合型的角色，把两种看起来相反的需求结合起来。`,`Your top two colours, ${a} and ${b}, sit opposite each other on the hexagon, an uncommon mix. Hybrid roles that combine two seemingly opposite needs may suit you best.`]);
}

       <div class="cell wide"><span class="eyebrow">${u('teamL')}</span><p>${t(T.team)}</p></div>

     <div class="ibars">${ORDER.map(k=>`<div class="ibar"><span>${k} ${t(TYPES[k].full)}</span><span class="track"><i style="width:${Math.max(4,r.share[k]*100)}%;background:var(--${k.toLowerCase()})"></i></span><span>${r.cnt[k]}/${r.app[k]}</span></div>`).join('')}</div>

function drawHex(r){
  const cv=$('hexArt');if(!cv)return;const {ctx,W,H}=setupCanvas(cv);
  ctx.clearRect(0,0,W,H);grain(ctx,W,H,9,.04);
  drawConstellation(ctx,{cx:W/2,cy:H/2+4,R:Math.min(W,H)*0.31,code:r.code,prog:1,sizes:r.share,font:13,names:true});
}

/* ================= SHARE CARD ================= */
function wrapText(ctx,text,x,y,maxW,lh,maxLines=9){
  const tokens=LANG==='en'?text.split(/(\s+)/):[...text];let line='',lines=0;
  for(const tk of tokens){const tt=line+tk;if(ctx.measureText(tt).width>maxW&&line.trim()){ctx.fillText(line.trim(),x,y);y+=lh;line=tk.trimStart();if(++lines>=maxLines)return y}else line=tt}
  if(line.trim()){ctx.fillText(line.trim(),x,y);y+=lh}return y;
}
function fitFont(ctx,text,weight,size,family,maxW){let s=size;do{ctx.font=`${weight} ${s}px ${family}`;s-=2}while(ctx.measureText(text).width>maxW&&s>20);return ctx.font}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function loadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
async function makeCard(r){
  const btn=$('cardBtn');btn.disabled=true;btn.textContent=u('making');
  try{await document.fonts.ready}catch(e){}
  const id=charOf(r),CH=CHARS[id],E=ENERGY[id[1]];
  const [k0,k1]=r.code,T=TYPES[k0],pct=Math.round(T.pct/2),[bk,bid]=relations(id)[0];
  let art,pal;try{art=await loadImg(celURI(id));pal=await loadImg(celURI(bid))}catch(e){}
  const W=1080,H=3000,cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  const SANS='"PingFang SC","Microsoft YaHei",sans-serif',SERIF='"Songti SC","STSong","SimSun",serif',MONO='Menlo,Consolas,monospace';
  const INK='#1F1717',DIM='#5C524A',PAPER='#FBF7EE',M=96;
  ctx.fillStyle='#EFE8DA';ctx.fillRect(0,0,W,H);
  ctx.textBaseline='alphabetic';
  const chipRow=(x,y,size)=>{r.code.forEach((k,j)=>{const cx=x+j*(size+12);ctx.fillStyle=LIGHT[k];rr(ctx,cx,y,size,size,size*.22);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.fillStyle=INK;ctx.font=`600 ${size*.56}px ${MONO}`;ctx.textAlign='center';ctx.fillText(k,cx+size/2,y+size*.7)});ctx.textAlign='left'};
  // header
  ctx.fillStyle=DIM;ctx.font=`500 30px ${SANS}`;ctx.textAlign='left';ctx.fillText(u('cardTop'),M-24,96);
  // hero panel
  const P0=128;
  ctx.fillStyle=PAPER;rr(ctx,48,P0,W-96,1020,40);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
  if(art)ctx.drawImage(art,W/2-240,P0+20,480,611);
  ctx.textAlign='center';
  ctx.fillStyle=DIM;ctx.font=`500 32px ${SANS}`;ctx.fillText(`${k0} · ${t(E.lab)}`,W/2,P0+690);
  ctx.fillStyle=INK;ctx.font=fitFont(ctx,t(CH.n),900,LANG==='en'?104:120,SERIF,W-M*2);ctx.fillText(t(CH.n),W/2,P0+810);
  ctx.fillStyle='#4A413A';ctx.font=fitFont(ctx,t(CH.tag),600,40,SERIF,W-M*2);ctx.fillText(t(CH.tag),W/2,P0+878);
  chipRow(W/2-114,P0+912,68);
  // rarity + interest code panel
  let y=P0+1110;
  const rt=u('rarity',{p:pct});ctx.font=fitFont(ctx,rt,600,32,SANS,W-M*2-64);const tw=ctx.measureText(rt).width+64;
  ctx.fillStyle=INK;rr(ctx,W/2-tw/2,y-46,tw,66,33);ctx.fill();ctx.fillStyle='#FBF7EE';ctx.textAlign='center';ctx.fillText(rt,W/2,y-2);
  y+=60;
  const top=y;ctx.fillStyle='#16211E';rr(ctx,48,top,W-96,400,32);ctx.fill();
  drawConstellation(ctx,{cx:48+200,cy:top+205,R:118,code:r.code,prog:1,sizes:r.share,font:26});
  ctx.textAlign='left';const roles=t(UI.roles);
  r.code.forEach((k,j)=>{const yy=top+100+j*112;
    ctx.fillStyle=LIGHT[k];rr(ctx,446,yy-46,64,64,14);ctx.fill();
    ctx.fillStyle='#10201C';ctx.font=`600 36px ${MONO}`;ctx.textAlign='center';ctx.fillText(k,478,yy-2);ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.font=`500 24px ${SANS}`;ctx.fillText(`${roles[j]} · ${t(TYPES[k].full)}`,536,yy-22);
    ctx.fillStyle='#F2F6F4';ctx.font=`700 34px ${SANS}`;ctx.fillText(t(TYPES[k].word),536,yy+16)});
  y=top+460;
  // strengths / blind spot
  const colW=(W-96-24)/2,blind=blindSpots(id,r.big)[0];
  [[u('strengths'),t(T.s),48],[u('cardBlind'),t(blind[0]),48+colW+24]].forEach(([h,txt,x])=>{
    ctx.fillStyle=PAPER;rr(ctx,x,y,colW,180,28);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle=DIM;ctx.font=`500 24px ${SANS}`;ctx.fillText(h,x+30,y+52);
    ctx.fillStyle=INK;ctx.font=`600 ${LANG==='en'?28:31}px ${SANS}`;wrapText(ctx,txt,x+30,y+100,colW-60,42,2)});
  y+=240;
  // best match
  ctx.fillStyle=PAPER;rr(ctx,48,y,W-96,230,28);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  if(pal)ctx.drawImage(pal,72,y+14,158,201);
  ctx.textAlign='left';ctx.fillStyle=DIM;ctx.font=`500 24px ${SANS}`;ctx.fillText(u('relBest'),262,y+56);
  ctx.fillStyle=INK;ctx.font=`900 40px ${SERIF}`;ctx.fillText(t(CHARS[bid].n),262,y+108);
  ctx.fillStyle='#4A413A';ctx.font=`500 ${LANG==='en'?25:27}px ${SANS}`;wrapText(ctx,`“${t(REL[id].best[0])}”`,262,y+154,W-96-262+20,38,2);
  y+=290;
  // traits
  ctx.textAlign='left';ctx.font=`700 34px ${SANS}`;ctx.fillStyle=INK;ctx.fillText(u('cardTraits'),M-24,y);y+=64;
  BF_ORDER.forEach(k=>{const m=BF_META[k],p=r.big[k].pct;
    ctx.textAlign='left';ctx.font=fitFont(ctx,t(m.n),500,28,SANS,200);ctx.fillStyle='#4A413A';ctx.fillText(t(m.n),M-24,y);
    ctx.fillStyle='#DDD3C2';rr(ctx,290,y-20,410,14,7);ctx.fill();
    ctx.fillStyle='#0E5E57';rr(ctx,290,y-20,Math.max(14,410*p/100),14,7);ctx.fill();
    ctx.font=`600 28px ${SANS}`;ctx.fillStyle=INK;ctx.fillText(p>=65?t(m.hi):p<=35?t(m.lo):u('mid'),730,y);
    ctx.textAlign='right';ctx.fillStyle=DIM;ctx.font=`600 26px ${MONO}`;ctx.fillText(p+'%',W-M+24,y);
    y+=60});
  y+=40;ctx.textAlign='left';ctx.font=`700 34px ${SANS}`;ctx.fillStyle=INK;ctx.fillText(u('cardCareers'),M-24,y);
  y+=36;let x=M-24;ctx.font=`500 ${LANG==='en'?25:28}px ${SANS}`;
  t(CAREERS[pairKey(k0,k1)]).forEach(c=>{const w=ctx.measureText(c).width+44;if(x+w>W-M+24){x=M-24;y+=66}
    ctx.fillStyle=PAPER;rr(ctx,x,y,w,52,26);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle=INK;ctx.fillText(c,x+22,y+36);x+=w+12});
  const FH=y+52+110;
  ctx.fillStyle=DIM;ctx.font=`500 22px ${SANS}`;ctx.textAlign='left';ctx.fillText(u('cardFoot'),M-24,FH-50);
  ctx.textAlign='right';ctx.fillStyle=INK;ctx.font=`600 22px ${MONO}`;ctx.fillText('© KKMEFLICKER',W-M+24,FH-50);
  const out2=document.createElement('canvas');out2.width=W;out2.height=FH;out2.getContext('2d').drawImage(cv,0,0);
  const url=out2.toDataURL('image/png');
  const out=$('shareOut');out.hidden=false;
  out.innerHTML=`<img src="${url}" alt="${t(CH.n)}"><p class="note">${u('saveHint')}</p>`;
  btn.disabled=false;btn.textContent=u('cardAgain');
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
